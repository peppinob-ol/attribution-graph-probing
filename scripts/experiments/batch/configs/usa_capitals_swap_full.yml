version: 0.1
experiment_name: usa_capitals_swap_full

# Comprehensive template to compare against the minimal config.
# Use it as a menu of options; you can trim to what you need per run.

description: >
  Entity-swap batch pipeline. Graphs are generated via Neuronpedia API or precomputed,
  features are selected by cumulative influence or other policy, probe prompts are shared
  or templated, activations run locally (multi-GPU) or via API, grouping can be run and
  subgraphs uploaded back to Neuronpedia. Steps are toggleable.

paths:
  outputs_root: output/usa_capitals_swap
  # Optional: staging dir for temporary files, logs, manifests
  staging_root: output/staging

compute:
  # Local batch policy
  local:
    seeds_per_gpu: 1
    max_parallel_seeds: 8
  # Remote node settings (optional). Used by a runner to rsync/ssh.
  remote:
    enabled: false
    ssh_host: ""
    ssh_user: ""
    remote_root: "/home/user/experiments/usa_capitals_swap"
    rsync_excludes: ["*.tmp", "*.log"]

model:
  id: gemma-2-2b
  source_set: clt-hp
  dtype: bfloat16         # for local inference; fallback float32 on CPU
  token_limit: 4096

features:
  # Selection policies:
  # - cumulative_influence: take features with influence <= threshold (as in JSON)
  # - top_k: take the top K most influential features
  # - explicit_file: use a prebuilt features.json (list of {layer,index})
  selection: cumulative_influence
  threshold: 0.95         # used if selection=cumulative_influence
  explicit_file: ""       # used if selection=explicit_file
  include_embeddings: false


graph_generation:
  enabled: false          # true to generate graphs via API; false if graphs are precomputed
  api_key_env: NEURONPEDIA_API_KEY
  # API params for scripts/00_neuronpedia_graph_generation.py
  api_params:
    modelId: gemma-2-2b
    sourceSetName: gemmascope-transcoder-16k
    maxNLogits: 10
    desiredLogitProb: 0.95
    nodeThreshold: 0.80
    edgeThreshold: 0.85
    maxFeatureNodes: 5000
  # How to obtain the seed prompts for graph generation:
  # Options:
  #   - precomputed: you already have graph.json per seed (recommended for current workflow)
  #   - prompts_list: provide plain prompts (no placeholders) to generate graphs
  #   - templated: provide a template with {placeholders} and entities
  seeds_mode: precomputed   # precomputed | prompts_list | templated
  # If seeds_mode=precomputed, provide graph_json per seed in precomputed_seeds[] (see bottom).
  # If seeds_mode=prompts_list, provide items or a file:
  prompts_list:
    file: ""               # optional path to a file with one prompt per line (ignored if items present)
    items: []              # e.g., ["The capital of the state containing Dallas is", ...]
  # If seeds_mode=templated, provide a template and entities below:
  templated:
    seed_prompt: "The capital of the state containing {city} is"
    slug_template: "{state}_{city}"
    entities:
      items:
        - { city: "Dallas", state: "Texas", capital: "Austin" }
        - { city: "Oakland", state: "California", capital: "Sacramento" }

probes:
  # How to produce probe prompts for each seed (mutually exclusive mode):
  # - shared_file: copy the same prompts.json to each seed
  # - per_seed_file: provide prompts per seed in precomputed_seeds[].prompts_json
  # - templated: fill templates with seed entities
  # - api: use an LLM provider to generate prompts (future)
  mode: shared_file
  shared_file:
    prompts_json: examples_data/prompts.json
  per_seed_file:
    # When mode=per_seed_file, set precomputed_seeds[].prompts_json per seed
    note: "Provide prompts_json under each precomputed seed"
  templated:
    templates:
      - id: probe_city
        text: "entity: A city in {state}, USA is {city}"
      - id: probe_capital
        text: "entity: The capital city of {state} is {capital}"
      - id: probe_relationship
        text: "relationship: the state in which a city is located is the state containing"
  api:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.2
    n_per_concept: 5
    system_prompt_path: ""

get_activations:
  backend: local          # local | api
  local:
    chunk_by_layer: true
    include_zero: false
    gpus: [0, 1, 2, 3, 4, 5, 6, 7]
    # Optional: override env keys used by batch_get_activations.py
    env_paths:
      prompts_key: PROMPTS_JSON_PATH
      features_key: FEATURES_JSON_PATH
      out_json_key: OUT_JSON_PATH
  api:
    qps: 2
    checkpoint_path: output/checkpoints/usa_capitals_swap.json
    max_retries: 3
    backoff_max_seconds: 60
    use_baseline: true
    activation_threshold_quantile: 0.90

grouping:
  enabled: false
  window: 7
  blacklist: ""           # comma-separated tokens to avoid for naming
  thresholds:
    dict_peak_consistency_min: 0.8
    dict_n_distinct_peaks_max: 1
    sayx_func_vs_sem_min: 50.0
    sayx_layer_min: 7
    rel_sparsity_max: 0.45
    sem_layer_max: 3
    sem_conf_s_min: 0.50
    sem_func_vs_sem_max: 50.0
  upload:
    enabled: false
    api_key_env: NEURONPEDIA_API_KEY
    display_name_template: "{slug} (grouped)"
    overwrite_id: ""

steps:
  # Toggle pipeline modules. Runner should honor these.
  graph_generation: false
  feature_export: true
  probe_prompts: true
  activations: true
  grouping: false
  upload_subgraph: false
  # Behavior flags
  dry_run: false
  force: false            # re-run steps even if outputs exist

reproducibility:
  write_manifest: true
  include_commit_hash: true
  include_timestamp: true

# Precomputed seeds (used when graph_generation.enabled=false and seeds_mode=precomputed).
# Provide per-seed graph_json paths produced by the Streamlit app or 00_neuronpedia_graph_generation.py.
precomputed_seeds:
  - slug: texas_dallas
    graph_json: output/graph_data/texas_dallas.json
    # Optional per-seed overrides:
    prompts_json: ""      # used only if probes.mode=per_seed_file
    entity: { city: "Dallas", state: "Texas", capital: "Austin" }
    tags: ["swap_pair:texas_california"]

  - slug: california_oakland
    graph_json: output/graph_data/california_oakland.json
    prompts_json: ""      # used only if probes.mode=per_seed_file
    entity: { city: "Oakland", state: "California", capital: "Sacramento" }
    tags: ["swap_pair:texas_california"]




