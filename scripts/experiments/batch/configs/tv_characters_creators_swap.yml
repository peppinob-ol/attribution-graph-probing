version: 0.1
experiment_name: tv_characters_creators_swap
inputs:
  source_config: configs/tv_characters_creators_full.yml
  graphs_root: output/tv_characters_creators_batch
swap:
  mode: matrix
  include_identity: true
  # character = prompt input (trigger), show = intermediate concept, creator = answer
  concept_fields: [show, creator]
ct_steering:
  model_id: google/gemma-2-2b
  transcoder_set: mntss/clt-gemma-2-2b-2.5M
  M_ablate: -2
  M_amplify: 20
  temperature: 0.3
  n_tokens: 10
  freq_penalty: 2.0
  seed: 42
  top_k: 5
  freeze_attention: false
  steer_generated_tokens: false
compute:
  inherit_from_source: true
  remote:
    enabled: true
    batch_size: 4
    max_gpus: 8
steps:
  validate_inputs: true
  prepare_features: true
  run_steering: true
  aggregate_results: true
