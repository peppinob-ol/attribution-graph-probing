version: 0.1
inputs:
  source_config: configs/products_founders_full.yml
  graphs_root: output/products_founders_batch
swap:
  mode: defined_pairs
  include_identity: false
  concept_fields:
  - company
  - founder
  pairs:
  - - iphone
    - windows
  - - model_s
    - facebook
  - - oracle_db
    - dell_xps
  - - dyson
    - nike_shoes
  - - windows
    - iphone
ct_steering:
  model_id: google/gemma-2-2b
  transcoder_set: mntss/clt-gemma-2-2b-2.5M
  M_ablate: -2
  M_amplify: 20
  temperature: 0.3
  n_tokens: 10
  freq_penalty: 2.0
  seed: 42
  top_k: 5
  freeze_attention: false
  track_trajectory: true
compute:
  inherit_from_source: false
  remote:
    enabled: false
steps:
  validate_inputs: true
  prepare_features: true
  run_steering: true
  aggregate_results: true
experiment_name: trial_cross_products_random
control:
  mode: random_feature_matched
  replicates: 3
  seed: 42
  matching:
    match_layers: true
  exclusions:
    exclude_labeled_features: true
    exclude_concept_matching_supernodes: true
