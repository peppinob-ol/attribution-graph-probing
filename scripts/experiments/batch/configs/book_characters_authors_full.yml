version: 0.1
experiment_name: book_characters_authors_batch
paths:
  outputs_root: output/book_characters_authors_batch
model:
  id: gemma-2-2b
  source_set: clt-hp
features:
  selection: cumulative_influence
  threshold: 0.95
  post_filter:
    node_threshold: 95
probes:
  mode: templated
  templated:
    templates:
    - id: probe_character
      text: 'entity: A famous literary character is {character}'
    - id: probe_book
      text: 'entity: A famous book is {book}'
    - id: probe_author
      text: 'entity: The author of {book} is {author}'
    - id: probe_author_concept
      text: 'attribute: The person who wrote a book is called the author'
    - id: probe_relationship
      text: 'relationship: the person who wrote a literary work is its author'
graph_generation:
  enabled: true
  seeds_mode: templated
  templated:
    seed_prompt: The book featuring {character} was written by
    slug_template: '{slug}'
    entities:
      items:
      - slug: hermione_granger
        character: Hermione Granger
        book: Harry Potter
        author: J.K. Rowling
      - slug: frodo_baggins
        character: Frodo Baggins
        book: The Lord of the Rings
        author: J.R.R. Tolkien
      - slug: jay_gatsby
        character: Jay Gatsby
        book: The Great Gatsby
        author: F. Scott Fitzgerald
      - slug: holden_caulfield
        character: Holden Caulfield
        book: The Catcher in the Rye
        author: J.D. Salinger
      - slug: atticus_finch
        character: Atticus Finch
        book: To Kill a Mockingbird
        author: Harper Lee
      - slug: elizabeth_bennet
        character: Elizabeth Bennet
        book: Pride and Prejudice
        author: Jane Austen
      - slug: huckleberry_finn
        character: Huckleberry Finn
        book: Adventures of Huckleberry Finn
        author: Mark Twain
      - slug: captain_ahab
        character: Captain Ahab
        book: Moby Dick
        author: Herman Melville
      - slug: raskolnikov
        character: Raskolnikov
        book: Crime and Punishment
        author: Fyodor Dostoevsky
      - slug: don_quixote
        character: Don Quixote
        book: Don Quixote
        author: Miguel de Cervantes
      - slug: oliver_twist
        character: Oliver Twist
        book: Oliver Twist
        author: Charles Dickens
      - slug: dracula
        character: Count Dracula
        book: Dracula
        author: Bram Stoker
      - slug: anna_karenina
        character: Anna Karenina
        book: Anna Karenina
        author: Leo Tolstoy
      - slug: katniss_everdeen
