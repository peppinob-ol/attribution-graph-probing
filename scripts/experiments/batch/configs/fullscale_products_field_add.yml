version: 0.1
display_demo: true
inputs:
  source_config: configs/products_founders_full.yml
  graphs_root: output/products_founders_batch
swap:
  mode: matrix
  include_identity: true
  concept_fields: &id001
  - product
  - company
  - founder
  answer_field: founder
ct_steering:
  model_id: google/gemma-2-2b
  transcoder_set: mntss/clt-gemma-2-2b-2.5M
  M_ablate: -2
  M_amplify: 20
  temperature: 0.3
  n_tokens: 10
  freq_penalty: 2.0
  seed: 42
  top_k: 5
  freeze_attention: false
  track_trajectory: true
compute:
  inherit_from_source: false
  remote:
    enabled: false
steps:
  validate_inputs: true
  prepare_features: true
  run_steering: true
  aggregate_results: true
experiment_name: fullscale_products_field_add
control:
  mode: additivity
  runs:
  - fields:
    - product
  - fields:
    - company
  - fields:
    - founder
  - fields:
    - product
    - company
  - fields:
    - product
    - founder
  - fields:
    - company
    - founder
  - fields: *id001
