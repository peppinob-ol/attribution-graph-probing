version: 0.1
display_demo: false
# Top-K-by-node-influence baseline, per-pair budget-matched against the
# best-of (field-add variant + adaptive M) labeled result. Single bag,
# no field-additivity sub-selection. Outer M-search tunes M_amplify.
inputs:
  source_config: configs/usa_states_full.yml
  graphs_root: output/usa_states_batch
swap:
  mode: matrix
  include_identity: true
  concept_fields:
  - state
  - capital
  - city
  answer_field: capital
ct_steering:
  model_id: google/gemma-2-2b
  transcoder_set: mntss/clt-gemma-2-2b-2.5M
  M_ablate: -2
  M_amplify: 20
  temperature: 0.3
  n_tokens: 10
  freq_penalty: 2.0
  seed: 42
  top_k: 5
  freeze_attention: false
  track_trajectory: true
control:
  mode: topk_influence_matched
  budgets_csv: output/research/topk_budgets_usa.csv
  min_K: 1
m_search:
  enabled: true
  m_min: 0.1
  n_coarse_probes: 6
  n_fine_steps: 6
  log_tolerance: 0.1
  min_kl_drop: 1.0
compute:
  inherit_from_source: false
  remote:
    enabled: false
steps:
  validate_inputs: true
  prepare_features: true
  run_steering: true
  aggregate_results: true
experiment_name: topk_usa_influence_matched
