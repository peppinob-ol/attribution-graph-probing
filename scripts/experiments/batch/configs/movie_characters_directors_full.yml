version: 0.1
experiment_name: movie_characters_directors_batch
paths:
  outputs_root: output/movie_characters_directors_batch
model:
  id: gemma-2-2b
  source_set: clt-hp
features:
  selection: cumulative_influence
  threshold: 0.95
  post_filter:
    node_threshold: 95
probes:
  mode: templated
  templated:
    templates:
    - id: probe_character
      text: 'entity: A famous movie character is {character}'
    - id: probe_movie
      text: 'entity: A famous movie is {movie}'
    - id: probe_director
      text: 'entity: The director of {movie} is {director}'
    - id: probe_director_concept
      text: 'attribute: The person who directs and oversees the making of a film is
        the director'
    - id: probe_relationship
      text: 'relationship: the person who directed a film is its director'
graph_generation:
  enabled: true
  seeds_mode: templated
  templated:
    seed_prompt: The movie featuring {character} was directed by
    slug_template: '{slug}'
    entities:
      items:
      - slug: forrest_gump
        character: Forrest Gump
        movie: Forrest Gump
        director: Robert Zemeckis
      - slug: indiana_jones
        character: Indiana Jones
        movie: Raiders of the Lost Ark
        director: Steven Spielberg
      - slug: gandalf
        character: Gandalf
        movie: The Lord of the Rings
        director: Peter Jackson
      - slug: vito_corleone
        character: Vito Corleone
        movie: The Godfather
        director: Francis Ford Coppola
      - slug: tyler_durden
        character: Tyler Durden
        movie: Fight Club
        director: David Fincher
      - slug: clarice_starling
        character: Clarice Starling
        movie: The Silence of the Lambs
        director: Jonathan Demme
      - slug: jack_dawson
        character: Jack Dawson
        movie: Titanic
        director: James Cameron
      - slug: mia_wallace
        character: Mia Wallace
        movie: Pulp Fiction
        director: Quentin Tarantino
      - slug: jack_torrance
        character: Jack Torrance
        movie: The Shining
        director: Stanley Kubrick
      - slug: hannibal_lecter
        character: Hannibal Lecter
        movie: The Silence of the Lambs
        director: Jonathan Demme
      - slug: danny_torrance
        character: Danny Torrance
        movie: The Shining
        director: Stanley Kubrick
