python scripts/experiments/batch/run_batch_from_yaml.py --config scripts/experiments/batch/test_clt_hp_minimal.yml --forceversion: 0.1
experiment_name: usa_states_demo

# Demo config for US states entity swap with grouping and upload
# Currently configured for 2 states (Texas/California)
# Extend with Florida, New York, Illinois for 5-state demo

paths:
  outputs_root: output/usa_states_batch

model:
  id: gemma-2-2b
  source_set: clt-hp  # Now working with chunking!

features:
  selection: cumulative_influence
  threshold: 0.95

probes:
  mode: templated  # Generate entity-specific probes for each seed
  templated:
    templates:
      - id: probe_city
        text: "entity: A major city in {state}, USA is {city}"
      - id: probe_capital
        text: "entity: The capital city of {state} is {capital}"
      - id: probe_state
        text: "entity: A state in the United States is {state}"
      - id: probe_capital_concept
        text: "attribute: The primary city serving as the seat of government for a state is the capital city"
      - id: probe_relationship
        text: "relationship: the state in which a city is located is the state containing"

get_activations:
  backend: local
  local:
    chunk_by_layer: true  # Required for clt-hp
    include_zero: false
    gpus: [0]

compute:
  remote:
    enabled: true  # Run on EleutherAI node
    host_env: "ELEUTHERAI_NODE_IP"
    user: "giuseppe"
    password_env: "ELEUTHERAI_NODE_PSW"
    base_dir: "/mnt/ssd-1/soar-automated_interpretability/graphs/giuseppe"
    repo_dir: "/mnt/ssd-1/soar-automated_interpretability/graphs/giuseppe/attribution-graph-probing"
    logs_dir: "/mnt/ssd-1/soar-automated_interpretability/graphs/giuseppe/logs"
    env_activate_cmd: "source /mnt/ssd-1/soar-automated_interpretability/graphs/giuseppe/env.sh"
    gpu_selection: auto          # auto (nvidia-smi heuristic) | manual
    max_gpus: 2                  # upper bound on concurrent jobs to respect etiquette
    batch_size: 5                # seeds per remote activation batch
    persist_sae_cache: true      # keep downloaded SAE layers on disk between batches

grouping:
  enabled: true  # Enable classification and naming
  window: 7
  blacklist: ""
  thresholds:
    dict_peak_consistency_min: 0.8
    dict_n_distinct_peaks_max: 1
    sayx_func_vs_sem_min: 50.0
    sayx_layer_min: 7
    rel_sparsity_max: 0.45
    sem_layer_max: 3
    sem_conf_s_min: 0.50
    sem_func_vs_sem_max: 50.0
  upload:
    enabled: true  # Upload subgraphs to Neuronpedia
    api_key_env: NEURONPEDIA_API_KEY
    display_name_template: "{slug} (auto-grouped)"
    overwrite_id: ""

steps:
  graph_generation: true   # Generate graphs via Neuronpedia API
  feature_export: true
  probe_prompts: true
  activations: true
  grouping: true           # Enable grouping step
  upload_subgraph: true    # Enable Neuronpedia upload
  dry_run: false
  force: false

graph_generation:
  enabled: true
  seeds_mode: templated    # Generate from template + entities
  api_key_env: NEURONPEDIA_API_KEY
  api_params:
    modelId: gemma-2-2b
    sourceSetName: gemmascope-transcoder-16k
    maxNLogits: 10
    desiredLogitProb: 0.95
    nodeThreshold: 0.80
    edgeThreshold: 0.85
    maxFeatureNodes: 5000
  templated:
    seed_prompt: "The capital of the state containing {city} is"
    slug_template: "{state}_{city}"
    entities:
      items:
        - { city: "Dallas", state: "texas", capital: "Austin" }
        - { city: "Oakland", state: "california", capital: "Sacramento" }
        - { city: "Miami", state: "florida", capital: "Tallahassee" }
        - { city: "Buffalo", state: "newyork", capital: "Albany" }
        - { city: "Chicago", state: "illinois", capital: "Springfield" }

