version: 0.1
experiment_name: songs_lead_singers_batch
paths:
  outputs_root: output/songs_lead_singers_batch
model:
  id: gemma-2-2b
  source_set: clt-hp
features:
  selection: cumulative_influence
  threshold: 0.95
  post_filter:
    node_threshold: 95
probes:
  mode: templated
  templated:
    templates:
    - id: probe_song
      text: 'entity: A famous song by {band} is {song}'
    - id: probe_band
      text: 'entity: A famous rock band is {band}'
    - id: probe_singer
      text: 'entity: The lead singer of {band} is {lead_singer}'
    - id: probe_band_concept
      text: 'attribute: A musical group that performs songs together is called a band'
    - id: probe_relationship
      text: 'relationship: the lead vocalist of a band is the lead singer'
get_activations:
  backend: local
  local:
    chunk_by_layer: true
    include_zero: false
    gpus: [0, 1, 2, 3, 4, 5, 6, 7]
    batch_size: 2

grouping:
  enabled: true
  window: 7
  blacklist_tokens:
    - "<bos>"
    - "entity"
    - "attribute"
    - "relationship"
  thresholds:
    dict_peak_consistency_min: 0.8
    dict_n_distinct_peaks_max: 1
    sayx_func_vs_sem_min: 50.0
    sayx_layer_min: 7
    rel_sparsity_max: 0.45
    sem_layer_max: 3
    sem_conf_s_min: 0.50
    sem_func_vs_sem_max: 50.0
  upload:
    enabled: true
    api_key_env: NEURONPEDIA_API_KEY
    display_name_template: "{slug} (auto-grouped)"
    overwrite_id: ""

steps:
  graph_generation: true
  feature_export: true
  probe_prompts: true
  activations: true
  grouping: true
  upload_subgraph: true

graph_generation:
  enabled: true
  seeds_mode: templated
  templated:
    seed_prompt: The name of the lead singer of the band that performed {song} is
    slug_template: '{slug}'
    entities:
      items:
      - slug: teen_spirit
        song: Smells Like Teen Spirit
        band: Nirvana
        lead_singer: Kurt Cobain
      - slug: stairway_to_heaven
        song: Stairway to Heaven
        band: Led Zeppelin
        lead_singer: Robert Plant
      - slug: enter_sandman
        song: Enter Sandman
        band: Metallica
        lead_singer: James Hetfield
      - slug: back_in_black
        song: Back in Black
        band: AC/DC
        lead_singer: Brian Johnson
      - slug: livin_on_a_prayer
        song: Livin' on a Prayer
        band: Bon Jovi
        lead_singer: Jon Bon Jovi
      - slug: everlong
        song: Everlong
        band: Foo Fighters
        lead_singer: Dave Grohl
