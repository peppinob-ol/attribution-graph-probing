version: 0.1
experiment_name: test_state_swap_6states

# Pilot swap config: run a small NxN matrix on 6 states before scaling to 50x50.
#
# Tip (traceability): run with a stable run id so you can resume and compare:
#   python run_batch_swaps.py --config configs/test_state_swap_6states.yml --run-id pilot_6states_v1

inputs:
  # Keep this relative to THIS file so it works no matter your current working directory.
  source_config: usa_states_full.yml
  graphs_root: output/usa_states_batch

swap:
  mode: matrix
  include_identity: true
  subset:
    - new_york_new_york_city
    - texas_dallas
    - michigan_detroit
    - georgia_savannah
    - north_carolina_charlotte
    - wyoming_casper
  # Which entity fields to use as "concept strings" when matching supernode_name.
  # This is domain-agnostic: for USA states we use state+capital.
  concept_fields:
    - state
    - capital

ct_steering:
  model_id: google/gemma-2-2b
  transcoder_set: mntss/clt-gemma-2-2b-2.5M
  M_ablate: -2
  M_amplify: 20
  temperature: 0.3
  n_tokens: 10
  freq_penalty: 2.0
  seed: 42
  top_k: 5
  freeze_attention: false
  steer_generated_tokens: false

compute:
  inherit_from_source: true
  remote:
    # NOTE (new machine): override remote paths here without editing usa_states_full.yml.
    # These must exist on nodo207 (the runner will create base_dir/logs_dir, but repo_dir/env.sh must be prepared).
    enabled: true
    host: "nodo207"
    # Set your remote username explicitly (recommended on a fresh laptop without SSH alias config).
    # If you have an SSH config alias that already encodes the user, you can set this to "".
    user: "giuseppe"
    # IMPORTANT: nodo207 has a non-writable folder at:
    #   /mnt/ssd-1/soar-automated_interpretability/graphs/giuseppe  (owned by a different UID)
    #
    # For a "fresh install" that always works, keep everything under your home:
    base_dir: "<repo>"
    repo_dir: "<repo>"
    logs_dir: "<repo>/logs"
    env_activate_cmd: "source <repo>/env.sh"
    batch_size: 1
    max_gpus: 1

steps:
  validate_inputs: true
  prepare_features: true
  run_steering: true
  aggregate_results: true


