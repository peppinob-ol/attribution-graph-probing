version: 0.1
experiment_name: trial_control_field_additivity

# Trial: field-based additivity decomposition.
# Tests which entity fields (state, capital, city) carry the steering signal.
# Uses concept_fields: [state, capital, city] so all three are available
# for supernode matching.
#
# Example pair: New Mexico / Albuquerque -> Pennsylvania / Philadelphia
# Seed prompt: "The capital of the state containing Albuquerque is Santa Fe"
# Fields: state=New Mexico, capital=Santa Fe, city=Albuquerque

inputs:
  source_config: configs/usa_states_full.yml
  graphs_root: output/usa_states_batch

swap:
  mode: defined_pairs
  include_identity: false
  concept_fields: [state, capital, city]
  pairs:
    # Diverse pairs covering easy, medium, hard
    - [new_mexico_albuquerque, pennsylvania_philadelphia]
    - [texas_dallas, georgia_savannah]
    - [california_oakland, florida_miami]
    - [colorado_colorado_springs, new_york_new_york_city]
    - [georgia_savannah, texas_dallas]

control:
  mode: additivity
  runs:
    # Single-field decomposition
    - fields: [state]
    - fields: [capital]
    - fields: [city]
    # Two-field combinations
    - fields: [state, capital]
    - fields: [state, city]
    - fields: [capital, city]
    # Full (equivalent to labeled with 3 fields)
    - fields: [state, capital, city]

ct_steering:
  model_id: google/gemma-2-2b
  transcoder_set: mntss/clt-gemma-2-2b-2.5M
  M_ablate: -2
  M_amplify: 20
  temperature: 0.3
  n_tokens: 10
  freq_penalty: 2.0
  seed: 42
  top_k: 5
  freeze_attention: false
  track_trajectory: true

compute:
  inherit_from_source: false
  remote:
    enabled: false

steps:
  validate_inputs: true
  prepare_features: true
  run_steering: true
  aggregate_results: true
