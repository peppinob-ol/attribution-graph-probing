version: 0.1
experiment_name: book_characters_authors_swap
inputs:
  source_config: configs/book_characters_authors_full.yml
  graphs_root: output/book_characters_authors_batch
swap:
  mode: matrix
  include_identity: true
  # Entity fields used as concepts for supernode matching (book domain)
  # character is the prompt input (like city in USA), not a concept to swap
  # book = intermediate concept (like state), author = answer (like capital)
  concept_fields: [book, author]
ct_steering:
  model_id: google/gemma-2-2b
  transcoder_set: mntss/clt-gemma-2-2b-2.5M
  M_ablate: -2
  M_amplify: 20
  temperature: 0.3
  n_tokens: 10
  freq_penalty: 2.0
  seed: 42
  top_k: 5
  freeze_attention: false
  steer_generated_tokens: false
compute:
  inherit_from_source: false
  remote:
    enabled: false
steps:
  validate_inputs: true
  prepare_features: true
  run_steering: true
  aggregate_results: true
