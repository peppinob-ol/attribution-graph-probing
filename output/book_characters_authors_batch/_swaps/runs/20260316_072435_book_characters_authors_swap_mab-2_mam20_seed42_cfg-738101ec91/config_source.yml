version: 0.1
experiment_name: book_characters_authors_batch
paths:
  outputs_root: output/book_characters_authors_batch
model:
  id: gemma-2-2b
  source_set: clt-hp
features:
  selection: cumulative_influence
  threshold: 0.95
  post_filter:
    node_threshold: 95
probes:
  mode: templated
  templated:
    templates:
    - id: probe_character
      text: 'entity: A famous literary character is {character}'
    - id: probe_book
      text: 'entity: A famous book is {book}'
    - id: probe_author
      text: 'entity: The author of {book} is {author}'
    - id: probe_author_concept
      text: 'attribute: The person who wrote a book is called the author'
    - id: probe_relationship
      text: 'relationship: the person who wrote a literary work is its author'
get_activations:
  backend: local
  local:
    chunk_by_layer: true
    include_zero: false
    gpus: [0, 1, 2, 3, 4, 5, 6, 7]
    batch_size: 2

grouping:
  enabled: true
  window: 7
  blacklist_tokens:
    - "<bos>"
    - "entity"
    - "attribute"
    - "relationship"
  thresholds:
    dict_peak_consistency_min: 0.8
    dict_n_distinct_peaks_max: 1
    sayx_func_vs_sem_min: 50.0
    sayx_layer_min: 7
    rel_sparsity_max: 0.45
    sem_layer_max: 3
    sem_conf_s_min: 0.50
    sem_func_vs_sem_max: 50.0
  upload:
    enabled: true
    api_key_env: NEURONPEDIA_API_KEY
    display_name_template: "{slug} (auto-grouped)"
    overwrite_id: ""

steps:
  graph_generation: true
  feature_export: true
  probe_prompts: true
  activations: true
  grouping: true
  upload_subgraph: true

graph_generation:
  enabled: true
  seeds_mode: templated
  templated:
    seed_prompt: The book featuring {character} was written by
    slug_template: '{slug}'
    entities:
      items:
      - slug: hermione_granger
        character: Hermione Granger
        book: Harry Potter
        author: J.K. Rowling
      - slug: frodo_baggins
        character: Frodo Baggins
        book: The Lord of the Rings
        author: J.R.R. Tolkien
      - slug: jay_gatsby
        character: Jay Gatsby
        book: The Great Gatsby
        author: F. Scott Fitzgerald
      - slug: holden_caulfield
        character: Holden Caulfield
        book: The Catcher in the Rye
        author: J.D. Salinger
      - slug: atticus_finch
        character: Atticus Finch
        book: To Kill a Mockingbird
