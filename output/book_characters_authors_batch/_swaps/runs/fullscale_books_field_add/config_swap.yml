version: 0.1
inputs:
  source_config: configs/book_characters_authors_full.yml
  graphs_root: output/book_characters_authors_batch
swap:
  mode: matrix
  include_identity: true
  concept_fields: &id001
  - character
  - book
  - author
  answer_field: author
ct_steering:
  model_id: google/gemma-2-2b
  transcoder_set: mntss/clt-gemma-2-2b-2.5M
  M_ablate: -2
  M_amplify: 20
  temperature: 0.3
  n_tokens: 10
  freq_penalty: 2.0
  seed: 42
  top_k: 5
  freeze_attention: false
  track_trajectory: true
compute:
  inherit_from_source: false
  remote:
    enabled: false
steps:
  validate_inputs: true
  prepare_features: true
  run_steering: true
  aggregate_results: true
experiment_name: fullscale_books_field_add
control:
  mode: additivity
  runs:
  - fields:
    - character
  - fields:
    - book
  - fields:
    - author
  - fields:
    - character
    - book
  - fields:
    - character
    - author
  - fields:
    - book
    - author
  - fields: *id001
