version: 0.1
display_demo: true
inputs:
  source_config: configs/sounds_colors_full.yml
  graphs_root: output/sounds_colors_batch
swap:
  mode: matrix
  include_identity: true
  concept_fields:
  - sound
  - animal
  - color
  answer_field: color
ct_steering:
  model_id: google/gemma-2-2b
  transcoder_set: mntss/clt-gemma-2-2b-2.5M
  M_ablate: -2
  M_amplify: 0.1
  temperature: 0.3
  n_tokens: 10
  freq_penalty: 2.0
  seed: 42
  top_k: 5
  freeze_attention: false
  track_trajectory: true
compute:
  inherit_from_source: false
  remote:
    enabled: false
steps:
  validate_inputs: true
  prepare_features: true
  run_steering: true
  aggregate_results: true
experiment_name: sweep_sounds_m0_1
