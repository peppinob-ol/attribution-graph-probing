version: 0.1
experiment_name: usa_states_fact_full_batch

# Same as usa_states_full.yml but with the "Fact:" prompt template used by
# mh2parker's public Neuronpedia view (slug `gemma-fact-dallas-austin`).
# Used to compare human-annotated subgraph vs auto pipeline on matched prompts.
#
# Outputs to a separate `output/usa_states_fact_batch/` root so this run does
# not conflict with the existing `output/usa_states_batch/` data.

paths:
  outputs_root: <repo>/output/usa_states_fact_batch

model:
  id: gemma-2-2b
  source_set: gemmascope-transcoder-16k

features:
  selection: cumulative_influence
  threshold: 0.95
  post_filter:
    node_threshold: 95   # keep features with cumulative influence <= 0.95

probes:
  mode: templated
  templated:
    templates:
      - id: probe_city
        text: "entity: A major city in {state}, USA is {city}"
      - id: probe_capital
        text: "entity: The capital city of {state} is {capital}"
      - id: probe_state
        text: "entity: A state in the United States is {state}"
      - id: probe_capital_concept
        text: "attribute: The primary city serving as the seat of government for a state is the capital city"
      - id: probe_relationship
        text: "relationship: the state in which a city is located is the state containing"

get_activations:
  backend: local
  local:
    chunk_by_layer: true
    include_zero: false
    gpus: [0]

compute:
  remote:
    enabled: false   # Local GPUs available on this host

grouping:
  enabled: true
  window: 7
  blacklist: ""
  blacklist_tokens:
    - "<bos>"
  thresholds:
    dict_peak_consistency_min: 0.8
    dict_n_distinct_peaks_max: 1
    sayx_func_vs_sem_min: 50.0
    sayx_layer_min: 7
    rel_sparsity_max: 0.45
    sem_layer_max: 3
    sem_conf_s_min: 0.50
    sem_func_vs_sem_max: 50.0
  upload:
    enabled: false
    api_key_env: NEURONPEDIA_API_KEY
    display_name_template: "{slug} (auto-grouped)"
    overwrite_id: ""

steps:
  graph_generation: true
  feature_export: true
  probe_prompts: true
  activations: true
  grouping: true
  upload_subgraph: false
  dry_run: false
  force: false

graph_generation:
  enabled: true
  seeds_mode: templated
  api_key_env: NEURONPEDIA_API_KEY
  api_params:
    modelId: gemma-2-2b
    sourceSetName: gemmascope-transcoder-16k
    maxNLogits: 10
    desiredLogitProb: 0.95
    nodeThreshold: 0.80
    edgeThreshold: 0.85
    maxFeatureNodes: 5000
  templated:
    seed_prompt: "Fact: The capital of the state containing {city} is"
    slug_template: "{slug}"
    entities:
      items:
        - { slug: "alabama_birmingham", city: "Birmingham", state: "Alabama", capital: "Montgomery" }
