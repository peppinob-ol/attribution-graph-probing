version: 0.1
experiment_name: smoke_swap_shuffled_labels_dallas
display_demo: false

# Phase-3 smoke condition: SHUFFLED-LABELS-DALLAS (label-importance control).
# Source grouping = same 22 human-pinned features, but with the supernode
# *labels* permuted (seed=42). Tests whether the labels carry information
# beyond the features themselves (if shuffled does as well as human, the
# match is feature-driven; if it crashes, labels are necessary).
inputs:
  source_config: configs/smoke_fact_6states.yml
  graphs_root: output/usa_states_fact_batch/_swap_conditions/shuffled_labels_dallas

swap:
  mode: defined_pairs
  pairs:
    - [texas_dallas, california_oakland]
    - [texas_dallas, new_york_new_york_city]
    - [texas_dallas, florida_miami]
    - [texas_dallas, illinois_chicago]
    - [texas_dallas, washington_seattle]
  concept_fields: &concept_fields
    - state
    - capital
    - city
  answer_field: capital

ct_steering:
  model_id: google/gemma-2-2b
  transcoder_set: gemma
  M_ablate: -2
  M_amplify: 20
  temperature: 0.3
  n_tokens: 10
  freq_penalty: 2.0
  seed: 42
  top_k: 5
  freeze_attention: false
  track_trajectory: true

compute:
  inherit_from_source: false
  remote:
    enabled: false

steps:
  validate_inputs: true
  prepare_features: true
  run_steering: true
  aggregate_results: true

control:
  mode: additivity
  runs:
    - fields: [state]
    - fields: [capital]
    - fields: [city]
    - fields: [state, capital]
    - fields: [state, city]
    - fields: [capital, city]
    - fields: *concept_fields
