version: 0.1
inputs:
  source_config: configs/paintings_painters_full.yml
  graphs_root: output/paintings_painters_batch
swap:
  mode: matrix
  include_identity: true
  concept_fields: &id001
  - painting
  - painter
  - first_name
  answer_field: first_name
ct_steering:
  model_id: google/gemma-2-2b
  transcoder_set: mntss/clt-gemma-2-2b-2.5M
  M_ablate: -2
  M_amplify: 20
  temperature: 0.3
  n_tokens: 10
  freq_penalty: 2.0
  seed: 42
  top_k: 5
  freeze_attention: false
  track_trajectory: true
compute:
  inherit_from_source: false
  remote:
    enabled: false
steps:
  validate_inputs: true
  prepare_features: true
  run_steering: true
  aggregate_results: true
experiment_name: fullscale_paintings_field_add
control:
  mode: additivity
  runs:
  - fields:
    - painting
  - fields:
    - painter
  - fields:
    - first_name
  - fields:
    - painting
    - painter
  - fields:
    - painting
    - first_name
  - fields:
    - painter
    - first_name
  - fields: *id001
